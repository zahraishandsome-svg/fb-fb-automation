name: Upload Slot 3 Page 3 (10PM PKT)

on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC — publish immediately on upload (no scheduling)
  workflow_dispatch:
    inputs:
      channel:
        description: "Optional: run only this channel ID"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no actual upload)"
        type: boolean
        default: false

env:
  DB_PAGE_ID: page_3

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get install -y --no-install-recommends --fix-missing ffmpeg || true
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: data/page_3.db
          key: fb-fb-automation-db-page_3-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            fb-fb-automation-db-page_3-${{ github.sha }}-

      - name: Restore credentials and tokens
        env:
          PAGE_3_SOURCE_CREDENTIALS: ${{ secrets.PAGE_3_SOURCE_CREDENTIALS }}
          PAGE_3_SOURCE_TOKEN: ${{ secrets.PAGE_3_SOURCE_TOKEN }}
          PAGE_3_DEST_CREDENTIALS: ${{ secrets.PAGE_3_DEST_CREDENTIALS }}
          PAGE_3_DEST_TOKEN: ${{ secrets.PAGE_3_DEST_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p credentials tokens
          if [ -n "$PAGE_3_SOURCE_CREDENTIALS" ]; then
            echo "$PAGE_3_SOURCE_CREDENTIALS" | base64 -d > credentials/page_3_source_credentials.json
          fi
          if [ -n "$PAGE_3_SOURCE_TOKEN" ]; then
            echo "$PAGE_3_SOURCE_TOKEN" | base64 -d > tokens/page_3_source_token.json
          fi
          if [ -n "$PAGE_3_DEST_CREDENTIALS" ]; then
            echo "$PAGE_3_DEST_CREDENTIALS" | base64 -d > credentials/page_3_dest_credentials.json
          fi
          if [ -n "$PAGE_3_DEST_TOKEN" ]; then
            echo "$PAGE_3_DEST_TOKEN" | base64 -d > tokens/page_3_dest_token.json
          fi
          printf "DISCORD_WEBHOOK_URL=%s\nLOG_LEVEL=INFO\n" "$DISCORD_WEBHOOK_URL" > .env
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> .env
          fi

      - name: Run slot 3
        run: python run.py --slot 3 --channel page_3

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/page_3.db
          key: fb-fb-automation-db-page_3-${{ github.sha }}-${{ github.run_id }}

      - name: Commit DB to repo
        if: always()
        run: |
          if [ ! -f data/page_3.db ]; then
            echo "No DB file found — skipping commit"
            exit 0
          fi
          cp data/page_3.db /tmp/page_3_new.db
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/page_3_new.db data/page_3.db
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/page_3.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: update page_3.db [skip ci]"
            git push origin main
          else
            echo "No DB changes to commit"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-slot3-page3-${{ github.run_id }}
          path: logs/
          retention-days: 14
