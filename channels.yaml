# Minutes between each channel's publish time within the same slot.
# Prevents multiple pages from publishing simultaneously (spam/rate-limit risk).
# page_1 publishes at base time, page_2 at base+5min, page_3 at base+10min, etc.
queue_interval_minutes: 5

channels:
  - id: page_1
    source_page_id: "1046482988557351"   # Walter Hayes
    source_page_name: "Walter Hayes"
    dest_page_name: "Walt Goodman"
    source_credentials_file: "credentials/page_1_source_credentials.json"
    source_token_file: "tokens/page_1_source_token.json"
    dest_credentials_file: "credentials/page_1_dest_credentials.json"
    dest_token_file: "tokens/page_1_dest_token.json"
    videos_per_day: 3
    description_footer: ""
    default_tags: []
    enabled: true
    max_retry_days: 3
    shorts_max_seconds: 180
    # Scheduled publishing: video uploads as draft, goes live at exact UTC time.
    # GitHub Actions delays never affect when viewers see the video.
    slot_publish_times_utc:
      1: "13:00"   # 6 PM PKT  (UTC+5)
      2: "15:00"   # 8 PM PKT  (UTC+5)
      3: "17:00"   # 10 PM PKT (UTC+5)

